name: Node.js CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: node --check server.js

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/udaymahamud/cloud-devops-node-app
          tags: |
            type=raw,value=main
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Debug OIDC token claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          PADDING=$((4 - ${#PAYLOAD} % 4))
          if [ "$PADDING" -ne 4 ]; then
            PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PADDING))"
          fi

          echo "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null | jq '{sub, aud}'
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::727974228658:role/GitHubActions-CloudDevOps-Deploy
          aws-region: eu-north-1
          allowed-account-ids: 727974228658

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy immutable Docker image
        env:
          INSTANCE_ID: i-05531341ea1b68579
        run: |
          IMAGE_TAG="sha-${GITHUB_SHA:0:7}"
          IMAGE="ghcr.io/udaymahamud/cloud-devops-node-app:${IMAGE_TAG}"

          echo "Deploying image: ${IMAGE}"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "CloudDevOps-Deploy" \
            --instance-ids "$INSTANCE_ID" \
            --parameters "Image=${IMAGE}" \
            --comment "Deploy ${IMAGE}" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          echo "Waiting for deployment..."

          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Current status: ${STATUS}"

            case "$STATUS" in
              Success)
                echo "Deployment successful."
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: ${STATUS}"

                echo "Standard output:"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text || true

                echo "Standard error:"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true

                exit 1
                ;;

              *)
                sleep 5
                ;;
            esac
          done